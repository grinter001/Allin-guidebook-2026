<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All In Golf Trip 2026</title>
  <style>body{margin:0;background:#0f3272;}</style>
  <script>
    (function () {
      var mobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      var smallScreen = window.innerWidth <= 768;
      if (mobileUA || smallScreen) {
        window.location.replace('mobile.html');
      } else {
        window.location.replace('desktop.html');
      }
    })();
  </script>
</head>
<body></body>
</html>
